databases:
  - name: janaushadhi-db
    databaseName: janaushadhi
    user: janaushadhi
    plan: free

services:
  - type: web
    name: janaushadhi-web
    runtime: python
    plan: free
    rootDir: JanAushadhi-Generic-Solutions-for-Better-Health-main
    buildCommand: bash build.sh
    startCommand: gunicorn janaushadhi.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janaushadhi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
  - type: web
    name: janaushadhi-recommender
    runtime: python
    plan: free
    rootDir: JanAushadhi-Generic-Solutions-for-Better-Health-main
    buildCommand: pip install -r requirements-recommender.txt && python recommend/build_model.py
    startCommand: cd recommend && streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection false